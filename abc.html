<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Education Timeline</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --ink: #09090b;
            --ink-soft: #52525b;
            --line: #e4e4e7;
            --paper: #fff;
            --dark: #111112;
            --w: 220px;
            --a: 132px;
            --tw: 200px;
            --font: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        body {
            font-family: var(--font);
            color: var(--ink);
            background: var(--paper);
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            display: grid;
            place-items: center;
            overflow-x: hidden
        }

        .stage {
            position: relative
        }

        .tl {
            position: relative;
            display: flex;
            height: 48px
        }

        .entry {
            position: relative;
            width: var(--w);
            height: 48px;
            margin-left: -16px;
            z-index: var(--z)
        }

        .entry:first-child {
            margin-left: 0
        }

        .seg {
            width: 100%;
            height: 100%;
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding-left: 22px;
            font-size: 17px;
            font-weight: 700;
            letter-spacing: -.02em;
            box-shadow: 0 0 0 6px var(--paper)
        }

        .entry:first-child .seg {
            padding-left: 0;
            box-shadow: none;
            border-radius: 10px 24px 24px 10px
        }

        .seg.p {
            background: var(--dark);
            color: #fff
        }

        .seg.c {
            background: var(--line);
            color: var(--ink-soft)
        }

        .item {
            position: absolute;
            left: var(--a);
            top: 0;
            width: 0;
            height: 0
        }

        .item.dn {
            top: 48px
        }

        .up {
            --lc: var(--dark)
        }

        .dn {
            --lc: var(--line)
        }

        .txt {
            position: absolute;
            right: 14px;
            width: var(--tw);
            text-align: right
        }

        .up .txt {
            bottom: 30px
        }

        .dn .txt {
            top: 30px
        }

        .txt h3 {
            font-size: 15px;
            font-weight: 600;
            letter-spacing: -.02em;
            margin: 0 8px 4px 0;
            text-align: center
        }

        .txt p {
            font-size: 13px;
            line-height: 1.5;
            color: var(--ink-soft)
        }

        .txt p b {
            display: block;
            font-weight: 600;
            color: var(--ink)
        }

        .ic {
            position: absolute;
            left: -23px;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            box-shadow: 0 0 0 5px var(--paper)
        }

        .up .ic {
            top: -153px;
            background: var(--dark);
            color: #fff
        }

        .dn .ic {
            top: 107px;
            background: var(--line);
            color: var(--ink-soft)
        }

        .ic svg {
            width: 22px;
            height: 22px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round
        }

        /* simple straight connector */
        .item::before {
            content: "";
            position: absolute;
            left: -2px;
            width: 4px;
            height: 107px;
            background: var(--lc)
        }

        .up::before {
            top: -107px
        }

        .dn::before {
            top: 0
        }

        /* joint dot on the bar */
        .item::after {
            content: "";
            position: absolute;
            left: -6px;
            top: -6px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--lc);
            box-shadow: 0 0 0 3px var(--paper)
        }
    </style>
</head>

<body>
    <main class="stage" id="stage"></main>
    <script>
        const ICONS = {
            school: '<path d="M3 21h18"/><path d="M5 21V9l7-5 7 5v12"/><path d="M9 21v-6h6v6"/><path d="M12 10h.01"/>',
            pencil: '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
            cap: '<path d="M22 10 12 5 2 10l10 5 10-5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/>'
        };
        const D = [
            { y: 2015, i: "school", t: "High School", d: "May 2015", s: "Saraswati Shishu Mandir, Rewa" },
            { y: 2017, i: "pencil", t: "Higher Secondary", d: "May 2017", s: "Umadutta Smriti Vidyalaya, Rewa" },
            { y: 2021, i: "cap", t: "Bachelor of Technology: Computer Science and Engineering", d: "May 2021", s: "Rajiv Gandhi Proudyogiki Vishwavidyalaya, Rewa" }
        ];
        document.getElementById("stage").innerHTML = `<div class="tl">${D.map((e, i) => {
            const up = i % 2 === 0;
            return `<div class="entry" style="--z:${i + 1}"><div class="seg ${up ? 'p' : 'c'}">${e.y}</div><div class="item ${up ? 'up' : 'dn'}"><div class="txt"><h3>${e.t}</h3><p><b>${e.d}</b>${e.s}</p></div><div class="ic"><svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[e.i]}</svg></div></div></div>`;
        }).join("")}</div>`;
        function fit() { const s = document.getElementById("stage"); s.style.zoom = 1; s.style.zoom = Math.min(1, innerWidth / s.offsetWidth) }
        addEventListener("resize", fit); fit();
    </script>
</body>

</html>
